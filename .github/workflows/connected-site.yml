name: connected-site
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  typed-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
