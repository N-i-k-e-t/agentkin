name: static-site
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check static HTML, local links and assets
        run: python3 scripts/check_site.py
