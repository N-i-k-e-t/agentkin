name: stale

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-pr-stale: 14
          days-before-pr-close: 16        # closes at 30 days total
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-pr-message: "Still working on this? Tell us what's blocking. It closes in 16 days without activity and can be reopened any time."
          exempt-pr-labels: "status:blocked,security"
          exempt-issue-labels: "good-first-issue,help-wanted,security"
